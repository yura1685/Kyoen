<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>共円回避</title>
    <style>
        body {
            background-color: #fff;
            color: #000;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        .header {
            margin-bottom: 10px;
        }
        h1 {
            font-size: 20px;
            margin: 10px 0;
        }
        input, button {
            border: 1px solid #000;
            background-color: #fff;
            color: #000;
            padding: 5px 10px;
            margin: 0 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover:not(:disabled) {
            background-color: #eee;
        }
        button:disabled {
            color: #999;
            border-color: #999;
            cursor: not-allowed;
        }
        canvas {
            background-color: #fff;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        #message {
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>共円回避</h1>
        <div>
            <label>盤面の大きさ：</label>
            <input type="number" id="boardSize" value="5" min="3" max="25" style="width: 50px;">
            <button id="generateBtn" onclick="startGame()">問題を生成</button>
            <button id="retryBtn" onclick="retryGame()" disabled>やり直す</button>
        </div>
        <div style="margin-top: 10px; font-size: 16px; display: flex; align-items: center; justify-content: center; height: 24px;">
            <div style="width: 260px; text-align: right; padding-right: 20px;">
                経過時間: <span id="timeDisplay">0.0</span>秒 &nbsp;|&nbsp; ミス数: <span id="missDisplay">0</span>
            </div>
            <div id="message" style="width: 260px; text-align: center;"></div>
        </div>
    </div>
    <div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const messageEl = document.getElementById('message');
        const retryBtn = document.getElementById('retryBtn');
        const generateBtn = document.getElementById('generateBtn');

        const timeDisplay = document.getElementById('timeDisplay');
        const missDisplay = document.getElementById('missDisplay');

        let startTime = 0;
        let timerInterval = null;
        let missCount = 0;

        let N = 5;
        let padding = 0;
        let cellSize = 0;
        let logicalSize = 0;

        let initialStones = [];
        let isGameOver = false;
        let errorStones = [];
        let placedStone = null;
        let xMarks = [];

        let longPressTimer = null;
        let isLongPressed = false;

        function setupCanvas() {
            const uiHeight = 150; 
            logicalSize = Math.min(window.innerWidth * 0.95, window.innerHeight - uiHeight);

            const dpr = window.devicePixelRatio || 1;

            canvas.style.width = logicalSize + 'px';
            canvas.style.height = logicalSize + 'px';

            canvas.width = logicalSize * dpr;
            canvas.height = logicalSize * dpr;

            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);

            padding = logicalSize * 0.1;
        }

        window.addEventListener('resize', () => {
            setupCanvas();
            drawBoard();
        });

        function oncircle(p1, p2, p3, p4) {
            let sq1 = p1.x * p1.x + p1.y * p1.y;
            let m11 = (p2.x * p2.x + p2.y * p2.y) - sq1, m12 = p2.x - p1.x, m13 = p2.y - p1.y;
            let m21 = (p3.x * p3.x + p3.y * p3.y) - sq1, m22 = p3.x - p1.x, m23 = p3.y - p1.y;
            let m31 = (p4.x * p4.x + p4.y * p4.y) - sq1, m32 = p4.x - p1.x, m33 = p4.y - p1.y;

            let det = m11 * (m22 * m33 - m23 * m32) - 
                      m12 * (m21 * m33 - m23 * m31) + 
                      m13 * (m21 * m32 - m22 * m31);
            return det === 0;
        }

        function generateProblem(boardSize) {
            const maxAttempts = 2000;
            const timeLimit = 2000; 
            const genStartTime = Date.now();

            for (let attempt = 0; attempt < maxAttempts; attempt++) {
                if (Date.now() - genStartTime > timeLimit) return null;

                let S = [];
                while (true) {
                    if (Date.now() - genStartTime > timeLimit) return null;

                    let cnt = 0;
                    let nextCandidates = [];

                    for (let h = 0; h < boardSize; h++) {
                        for (let w = 0; w < boardSize; w++) {
                            let p = {x: w, y: h};
                            if (S.some(sp => sp.x === p.x && sp.y === p.y)) continue;

                            let flag_out = false;

                            if (S.length >= 3) {
                                for (let i = 0; i < S.length && !flag_out; i++) {
                                    for (let j = i + 1; j < S.length && !flag_out; j++) {
                                        for (let k = j + 1; k < S.length; k++) {
                                            if (oncircle(S[i], S[j], S[k], p)) {
                                                flag_out = true;
                                                break;
                                            }
                                        }
                                    }
                                }
                            }
                            if (flag_out) continue;

                            cnt++;
                            nextCandidates.push(p);
                        }
                    }

                    if (cnt === 1) {
                        return { s: S };
                    } else if (cnt > 1) {
                        let r = Math.floor(Math.random() * cnt);
                        S.push(nextCandidates[r]);
                    } else {
                        break;
                    }
                }
            }
            return null;
        }

        function updateTimer() {
            let elapsed = Date.now() - startTime;
            timeDisplay.textContent = (elapsed / 1000).toFixed(1);
        }

        function startGame() {
            N = parseInt(document.getElementById('boardSize').value);
            if (isNaN(N) || N < 3) return;

            messageEl.textContent = "生成中...";
            messageEl.style.color = "#000";
            generateBtn.disabled = true;
            retryBtn.disabled = true;

            clearInterval(timerInterval);
            missCount = 0;
            timeDisplay.textContent = "0.0";
            missDisplay.textContent = missCount;

            setTimeout(() => {
                let problem = generateProblem(N);
                generateBtn.disabled = false;

                if (problem) {
                    initialStones = problem.s;
                    xMarks = []; 
                    resetGameState();
                    messageEl.textContent = "石を1つ置いてください";

                    startTime = Date.now();
                    timerInterval = setInterval(updateTimer, 100);
                } else {
                    messageEl.textContent = "生成失敗";
                    messageEl.style.color = "red";
                }
            }, 50);
        }

        function resetGameState() {
            isGameOver = false;
            errorStones = [];
            placedStone = null;
            retryBtn.disabled = true;
            messageEl.style.color = "#000";
            drawBoard();
        }

        function retryGame() {
            if (initialStones.length === 0) return;
            resetGameState();
            messageEl.textContent = "石を1つ置いてください";
        }

        function drawBoard() {
            ctx.clearRect(0, 0, logicalSize, logicalSize);

            cellSize = (logicalSize - padding * 2) / (N - 1);
            if (N === 1) cellSize = 0;

            ctx.strokeStyle = "#ccc";
            ctx.lineWidth = 1;
            for (let i = 0; i < N; i++) {
                ctx.beginPath();
                ctx.moveTo(padding + i * cellSize, padding);
                ctx.lineTo(padding + i * cellSize, logicalSize - padding);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(padding, padding + i * cellSize);
                ctx.lineTo(logicalSize - padding, padding + i * cellSize);
                ctx.stroke();
            }

            xMarks.forEach(p => drawX(p.x, p.y));

            initialStones.forEach(p => drawStone(p.x, p.y, "#000"));

            if (placedStone) {
                if (isGameOver && errorStones.length > 0) {
                    drawStone(placedStone.x, placedStone.y, "red");
                } else if (isGameOver && errorStones.length === 0) {
                    drawStone(placedStone.x, placedStone.y, "green");
                } else {
                    drawStone(placedStone.x, placedStone.y, "#000");
                }
            }

            errorStones.forEach(p => drawStone(p.x, p.y, "red"));
        }

        function drawStone(x, y, color) {
            let cx = padding + x * cellSize;
            let cy = padding + y * cellSize;
            let radius = Math.min(cellSize * 0.4, 40); 
            if (N === 1) radius = Math.min(logicalSize * 0.1, 40);

            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
        }

        function drawX(x, y) {
            let cx = padding + x * cellSize;
            let cy = padding + y * cellSize;
            let size = Math.min(cellSize * 0.25, 25); 
            if (N === 1) size = Math.min(logicalSize * 0.1, 25);

            ctx.strokeStyle = "#666"; 
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(cx - size, cy - size);
            ctx.lineTo(cx + size, cy + size);
            ctx.moveTo(cx - size, cy + size);
            ctx.lineTo(cx + size, cy - size);
            ctx.stroke();
        }

        canvas.addEventListener('click', function(e) {
            if (isLongPressed) {
                isLongPressed = false;
                return;
            }

            if (initialStones.length === 0) return;

            const rect = canvas.getBoundingClientRect();
            let logicalX = e.clientX - rect.left;
            let logicalY = e.clientY - rect.top;

            let gridX = Math.round((logicalX - padding) / cellSize);
            let gridY = Math.round((logicalY - padding) / cellSize);

            if (gridX < 0 || gridX >= N || gridY < 0 || gridY >= N) return;

            if (isGameOver) {
                if (errorStones.length > 0 && placedStone && placedStone.x === gridX && placedStone.y === gridY) {
                    retryGame(); 
                }
                return;
            }

            let p = {x: gridX, y: gridY};
            if (initialStones.some(sp => sp.x === p.x && sp.y === p.y)) return;

            placedStone = p;
            checkPlacement(p);
        });

        canvas.addEventListener('contextmenu', function(e) {
            e.preventDefault(); 
            if (initialStones.length === 0) return;

            const rect = canvas.getBoundingClientRect();
            let logicalX = e.clientX - rect.left;
            let logicalY = e.clientY - rect.top;

            let gridX = Math.round((logicalX - padding) / cellSize);
            let gridY = Math.round((logicalY - padding) / cellSize);

            if (gridX < 0 || gridX >= N || gridY < 0 || gridY >= N) return;

            let markIndex = xMarks.findIndex(m => m.x === gridX && m.y === gridY);
            if (markIndex !== -1) {
                xMarks.splice(markIndex, 1);
            } else {
                xMarks.push({x: gridX, y: gridY});
            }
            
            drawBoard(); 
        });

        canvas.addEventListener('touchstart', function(e) {
            if (initialStones.length === 0) return;
            isLongPressed = false;
            
            let touch = e.touches[0];
            
            longPressTimer = setTimeout(function() {
                isLongPressed = true;
                const rect = canvas.getBoundingClientRect();
                let logicalX = touch.clientX - rect.left;
                let logicalY = touch.clientY - rect.top;

                let gridX = Math.round((logicalX - padding) / cellSize);
                let gridY = Math.round((logicalY - padding) / cellSize);

                if (gridX < 0 || gridX >= N || gridY < 0 || gridY >= N) return;

                let markIndex = xMarks.findIndex(m => m.x === gridX && m.y === gridY);
                if (markIndex !== -1) {
                    xMarks.splice(markIndex, 1);
                } else {
                    xMarks.push({x: gridX, y: gridY});
                }
                
                drawBoard(); 
            }, 500);
        }, { passive: true });

        function cancelLongPress() {
            if (longPressTimer) {
                clearTimeout(longPressTimer);
                longPressTimer = null;
            }
        }

        canvas.addEventListener('touchmove', cancelLongPress, { passive: true });
        canvas.addEventListener('touchend', cancelLongPress);
        canvas.addEventListener('touchcancel', cancelLongPress);

        function checkPlacement(p) {
            let isError = false;
            errorStones = [];

            if (initialStones.length >= 3) {
                for (let i = 0; i < initialStones.length && !isError; i++) {
                    for (let j = i + 1; j < initialStones.length && !isError; j++) {
                        for (let k = j + 1; k < initialStones.length; k++) {
                            if (oncircle(initialStones[i], initialStones[j], initialStones[k], p)) {
                                isError = true;
                                errorStones.push(initialStones[i], initialStones[j], initialStones[k]);
                                break;
                            }
                        }
                    }
                }
            }

            isGameOver = true;

            if (isError) {
                missCount++;
                missDisplay.textContent = missCount;

                messageEl.textContent = "不正解";
                messageEl.style.color = "red";
                retryBtn.disabled = false;
            } else {
                clearInterval(timerInterval); 
                updateTimer(); 

                messageEl.textContent = "正解";
                messageEl.style.color = "green"; 
            }

            drawBoard();
        }

        setupCanvas();
        drawBoard();
    </script>
</body>
</html>
